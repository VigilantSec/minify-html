name: Build Python 3.15 wheels for VigilantSec

# Builds minify-html wheels for the platforms rubberband runs on and attaches them to a
# GitHub release. Tags are `vsec-*` so upstream's `v*` publish workflows never run here.
on:
  push:
    tags:
      - 'vsec-*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: '2_28'
          args: --release --strip -m minify-html-python/Cargo.toml -i python3.15
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: target/wheels/*.whl

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/vsec-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" wheels/*.whl --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "minify-html wheels for Python 3.15 (PyO3 0.29)."
